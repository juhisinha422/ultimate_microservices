##################################
# REDIS
##################################
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cart
  namespace: webapps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-cart
  template:
    metadata:
      labels:
        app: redis-cart
    spec:
      containers:
      - name: redis
        image: redis:7
        ports:
        - containerPort: 6379

---
