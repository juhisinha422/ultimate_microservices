##################################
# FRONTEND
##################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: webapps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: server
        image: juhisinha/frontend:latest
        ports:
        - containerPort: 8080

        env:
        - name: PORT
          value: "8080"

        - name: PRODUCT_CATALOG_SERVICE_ADDR
          value: "productcatalogservice:3550"

        - name: CART_SERVICE_ADDR
          value: "cartservice:7070"

        - name: CURRENCY_SERVICE_ADDR
          value: "currencyservice:7000"

        - name: CHECKOUT_SERVICE_ADDR
          value: "checkoutservice:5050"

        - name: SHIPPING_SERVICE_ADDR
          value: "shippingservice:50051"

        - name: AD_SERVICE_ADDR
          value: "adservice:9555"

        - name: RECOMMENDATION_SERVICE_ADDR
          value: "recommendationservice:8080"

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: webapps
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 8080


